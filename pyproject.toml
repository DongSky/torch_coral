[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-coral"
version = "0.3.0a9"
description = "Compile PyTorch inference graphs for legacy Coral Edge TPU"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["pytorch", "coral", "edgetpu", "inference", "quantization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<2; python_version < '3.12'",
  "numpy>=1.26,<3; python_version >= '3.12'",
  "torch>=2.14,<2.15; python_version >= '3.12'",
  "onnx>=1.20,<2; python_version >= '3.12'",
  "onnxscript>=0.6,<0.8; python_version >= '3.12'",
]

[project.optional-dependencies]
chat = ["PySide6>=6.8,<7; python_version >= '3.12'", "tokenizers>=0.23,<0.24; python_version >= '3.12'", "jinja2>=3.1.6,<4; python_version >= '3.12'"]
gui = ["PySide6>=6.8,<7; python_version >= '3.12'", "transformers>=5,<6; python_version >= '3.12'", "huggingface-hub>=1,<3; python_version >= '3.12'", "timm>=1,<2; python_version >= '3.12'", "truststore>=0.10,<1; python_version >= '3.12'"]
test = ["pytest>=8,<10", "onnxruntime>=1.26,<2; python_version >= '3.12'", "PySide6>=6.8,<7; python_version >= '3.12'"]
release = ["build>=1.2", "twine>=6"]

[project.scripts]
torch-coral = "torch_coral.cli:main"
coral-workbench = "torch_coral.gui:main"
coral-qwen-chat = "torch_coral.qwen_chat_gui:main"

[tool.setuptools]
packages = ["torch_coral", "torch_coral_runtime"]
include-package-data = false

[tool.setuptools.package-data]
torch_coral = ["dependencies/*.txt"]
