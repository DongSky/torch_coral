name: build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      # A fixed timestamp within the ZIP date range also works on Windows.
      SOURCE_DATE_EPOCH: "946684800"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install headless Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.14,<2.15"
      - run: python -m pip install -e ".[test,release]"
      - name: Run offline tests
        shell: python
        run: |
          import subprocess
          import sys
          result = subprocess.run([
              sys.executable, '-m', 'pytest', '-q', '--tb=short',
              'tests/test_distribution.py', 'tests/test_release_audit.py',
              'tests/test_experimental_ops.py', 'tests/test_operator_strategies.py',
              'tests/test_runtime_v2.py', 'tests/test_usb_buffers.py',
              'tests/test_usb_dispatch.py', 'tests/test_speculative.py',
              'tests/test_speculative_blocks.py',
          ], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(result.stdout)
          if result.returncode:
              # Keep failures visible in Checks as well as the full job log.
              message = result.stdout[-6000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + message)
          sys.exit(result.returncode)
      - run: python scripts/prepare-release.py --destination release/ci-public-source --report reports/ci-source-audit.json
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: distributions-${{ matrix.os }}
          path: dist/*
  legacy-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.9"
      - run: python -m pip install ".[test]"
      - run: python -m pytest tests/test_distribution.py tests/test_runtime_v2.py -q
      - run: python -c "import sys,torch_coral_runtime; assert 'torch' not in sys.modules"
