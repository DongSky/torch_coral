name: build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      SOURCE_DATE_EPOCH: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.14,<2.15"
      - run: python -m pip install -e ".[test,release]"
      - run: python -m pytest tests/test_distribution.py tests/test_release_audit.py tests/test_experimental_ops.py tests/test_operator_strategies.py tests/test_runtime_v2.py tests/test_usb_buffers.py tests/test_usb_dispatch.py tests/test_speculative.py tests/test_speculative_blocks.py -q
      - run: python scripts/prepare-release.py --destination release/ci-public-source --report reports/ci-source-audit.json
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}
          path: dist/*
  legacy-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install ".[test]"
      - run: python -m pytest tests/test_distribution.py tests/test_runtime_v2.py -q
      - run: python -c "import sys,torch_coral_runtime; assert 'torch' not in sys.modules"
